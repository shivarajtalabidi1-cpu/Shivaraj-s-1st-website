<!DOCTYPE html>
<html>
<head>
    <title>My AI Study Hub</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: #f2f2f2;
            margin: 0;
        }

        header {
            background: #222;
            color: white;
            padding: 30px;
        }

        .box {
            background: white;
            width: 80%;
            max-width: 600px;
            margin: 40px auto;
            padding: 30px;
            border-radius: 15px;
        }

        button {
            padding: 12px 25px;
            font-size: 16px;
            cursor: pointer;
        }

        #message {
            margin-top: 20px;
            font-size: 18px;
        }
    </style>
</head>

<body>

    <header>
        <h1>📚 My AI Study Hub</h1>
        <p>Learn • Practice • Improve</p>
    </header>

    <div class="box">
        <h2>Welcome!</h2>

        <p>This is my first website.</p>

        <button onclick="showMessage()">
            Click Me
        </button>

        <div id="message"></div>
    </div>

    <script>
        function showMessage() {
            document.getElementById("message").innerHTML =
                "🎉 Great! You just ran JavaScript!";
        }
    </script>

</body>
</html>
